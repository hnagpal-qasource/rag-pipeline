[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-telecom-chatbot"
version = "0.1.0"
description = "RAG-based telecom customer care chatbot tutorial"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-groq",
    "langchain-community<0.3.0",
    "langchain-text-splitters",
    "langchain-google-vertexai",
    "pandas",
    "python-dotenv",
    "streamlit",
    "fpdf2",
    "pypdf",
    "datasets",
    "ragas>=0.1.0,<0.2.0",
]

[tool.setuptools.packages.find]
include = ["ci*", "validation*"]